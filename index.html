<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo Secreto Familia</title>
<style>
  :root { color-scheme: light; --bg:#fbf7f2; --ink:#2b2b2b; --muted:#6b6b6b; --red:#b3261e; --green:#1f6f43; --card:#fff; --line:#e7e0d6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:640px; margin:0 auto; padding:28px 18px 60px; }
  h1 { font-size:28px; margin:0 0 6px; }
  p { line-height:1.5; }
  .muted { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin:16px 0; }
  label { font-weight:600; display:block; margin:12px 0 6px; }
  textarea, input { width:100%; font:inherit; font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  textarea { min-height:150px; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; min-width:0; }
  button, .btn { font:inherit; font-size:16px; font-weight:600; border:0; border-radius:10px; padding:12px 16px; cursor:pointer; text-decoration:none; display:inline-block; text-align:center; }
  .primary { background:var(--red); color:#fff; width:100%; font-size:18px; padding:14px; margin-top:16px; }
  .wa { background:#25a35a; color:#fff; }
  .ghost { background:#f1ece4; color:var(--ink); }
  .person { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-top:1px solid var(--line); }
  .person:first-child { border-top:0; }
  .person .name { font-weight:600; font-size:17px; }
  .person .actions { display:flex; gap:8px; flex-shrink:0; }
  .sent { color:var(--green); font-size:14px; }
  .err { color:var(--red); font-weight:600; }
  .ok { background:#e9f6ee; border:1px solid #b9e0c8; color:var(--green); border-radius:10px; padding:12px 14px; margin-top:10px; line-height:1.6; font-weight:600; }
  .warn { background:#fff5e0; border:1px solid #f0d9a8; border-radius:10px; padding:12px 14px; }
  /* Vista del participante */
  .reveal { text-align:center; padding-top:40px; }
  .reveal .hola { font-size:30px; margin:0; }
  .reveal .sub { font-size:22px; margin:28px 0 10px; color:var(--muted); }
  .reveal .target { font-size:52px; font-weight:800; color:var(--red); margin:0 0 28px; word-break:break-word; }
  .reveal .gift { font-size:64px; }
  .hidden { display:none; }
  .tapbox { margin:30px auto; max-width:360px; }
  .tapbox button { width:100%; font-size:22px; padding:20px; }
  .details { font-size:20px; line-height:1.6; }

  /* ---------- Escena navideña ---------- */
  body { background: linear-gradient(180deg, #0b1a33 0%, #16325c 55%, #2a4f80 100%) fixed; min-height:100vh; }
  main { position:relative; z-index:2; padding-bottom:170px; }
  .intro h1 { color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.35); }
  .intro p { color:#dbe6f5; text-shadow:0 1px 6px rgba(0,0,0,.5); }
  #snow { position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; }
  .scene { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .moon { position:absolute; top:6vh; right:8vw; width:90px; height:90px; border-radius:50%;
          background: radial-gradient(circle at 35% 35%, #fffbe8, #f3e6b5 70%); box-shadow:0 0 60px 18px rgba(255,244,200,.25); }
  .star { position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity:.25 } 50% { opacity:1 } }
  .ground { position:absolute; left:0; right:0; bottom:0; height:150px; }
  .ground svg { width:100%; height:100%; display:block; }
  .sleigh { position:absolute; top:calc(100vh - 235px); left:0; width:230px; animation: fly 26s linear infinite; animation-delay:2s; transform:translateX(-300px); }
  .sleigh .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes fly {
    0% { transform: translateX(-300px) translateY(30px) rotate(-4deg); }
    55% { transform: translateX(calc(100vw + 60px)) translateY(-40px) rotate(-4deg); }
    100% { transform: translateX(calc(100vw + 60px)) translateY(-40px) rotate(-4deg); }
  }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  .lights { position:fixed; top:0; left:0; right:0; height:34px; z-index:3; pointer-events:none; display:flex; justify-content:space-around; }
  .lights::before { content:""; position:absolute; top:-14px; left:-2%; right:-2%; height:30px; border-bottom:2px solid #2b3b2b; border-radius:0 0 50% 50% / 0 0 100% 100%; }
  .bulb { width:10px; height:15px; border-radius:50% 50% 45% 45%; margin-top:12px; animation: glow 1.4s ease-in-out infinite alternate; }
  .bulb:nth-child(4n+1) { background:#ff4d4d; color:#ff4d4d; }
  .bulb:nth-child(4n+2) { background:#ffd84d; color:#ffd84d; animation-delay:.35s; }
  .bulb:nth-child(4n+3) { background:#4dd06a; color:#4dd06a; animation-delay:.7s; }
  .bulb:nth-child(4n)   { background:#4db8ff; color:#4db8ff; animation-delay:1.05s; }
  @keyframes glow { from { opacity:.45; box-shadow:none } to { opacity:1; box-shadow:0 0 12px 3px currentColor } }
  .reveal-card { background:#fff; border-radius:20px; padding:26px 20px 30px; margin-top:30px; box-shadow:0 12px 40px rgba(0,0,0,.3); }
  .pop { animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop { from { transform:scale(.3); opacity:0 } to { transform:scale(1); opacity:1 } }
  .card { box-shadow:0 10px 30px rgba(0,0,0,.25); }
  @media (prefers-reduced-motion: reduce) {
    .sleigh, .sleigh .bob, .star, .bulb, .pop { animation:none !important; }
    .sleigh { display:none; }
  }

  @media (max-width:600px) { .moon { width:56px; height:56px; top:auto; bottom:200px; right:8vw; } .sleigh { width:180px; } }
</style>
</head>
<body>

  <div class="sleigh"><div class="bob">

      <path d="M150 52 Q118 40 92 44 M150 52 Q100 50 44 44" stroke="#c9a25a" stroke-width="1.4" fill="none"/>

  <div class="ground">
    <svg viewBox="0 0 1200 150" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <g fill="#14304f">
        <path d="M90 95 L110 40 L130 95 Z"/><path d="M95 70 L110 25 L125 70 Z"/>
        <path d="M980 90 L1004 28 L1028 90 Z"/><path d="M986 62 L1004 14 L1022 62 Z"/>
        <path d="M1060 98 L1076 55 L1092 98 Z"/>
        <path d="M200 100 L214 64 L228 100 Z"/>

      <path d="M0 100 Q150 60 320 95 T660 90 T980 92 T1200 80 L1200 150 L0 150 Z" fill="#e8f0fa"/>

</div>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="lights" aria-hidden="true"><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span></div>
<main id="app"></main>

<script>
(function () {
  const app = document.getElementById('app');
  const PREFIX = 'as';

  // ---------- codificación (oculta los nombres en el link) ----------
  function enc(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    const key = crypto.getRandomValues(new Uint8Array(6));
    let hex = '';
    key.forEach(b => hex += b.toString(16).padStart(2, '0'));
    bytes.forEach((b, i) => hex += (b ^ key[i % key.length] ^ ((i * 37) & 255)).toString(16).padStart(2, '0'));
    return PREFIX + hex;
  }
  function dec(s) {
    if (!s || s.indexOf(PREFIX) !== 0) return null;
    const hex = s.slice(PREFIX.length);
    if (!/^[0-9a-f]+$/.test(hex) || hex.length < 14) return null;
    const all = new Uint8Array(hex.length / 2);
    for (let i = 0; i < all.length; i++) all[i] = parseInt(hex.substr(i * 2, 2), 16);
    const key = all.slice(0, 6), data = all.slice(6);
    const out = data.map((b, i) => b ^ key[i % key.length] ^ ((i * 37) & 255));
    try { return JSON.parse(new TextDecoder().decode(out)); } catch (e) { return null; }
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ---------- vista del participante ----------
  function showReveal(d) {
    app.innerHTML = `
      <div class="reveal"><div class="reveal-card">
        <div class="gift" aria-hidden="true">🎁</div>
        <p class="hola">Hola, ${esc(d.g)}</p>
        <p class="muted" style="font-size:19px">Este es tu Amigo Secreto. No se lo muestres a nadie.</p>
        <div class="tapbox" id="tapbox"><button class="primary" id="ver">Ver a quién me tocó</button></div>
        <div id="res" class="hidden">
          <p class="sub">Te tocó regalarle a:</p>
          <p class="target pop">${esc(d.r)}</p>
          ${d.p || d.f ? `<div class="card details">${d.p ? `<div><b>Presupuesto:</b> ${esc(d.p)}</div>` : ''}${d.f ? `<div><b>Fecha:</b> ${esc(d.f)}</div>` : ''}</div>` : ''}
        </div>
      </div></div>`;
    document.getElementById('ver').onclick = () => {
      document.getElementById('tapbox').classList.add('hidden');
      document.getElementById('res').classList.remove('hidden');
    };
  }

  // ---------- sorteo ----------
  function parseHouses(text) {
    return text.split('\n').map(l => l.split(/[,;]+/).map(n => n.trim()).filter(Boolean)).filter(h => h.length);
  }
  function draw(houses) {
    const people = [], house = {};
    houses.forEach((h, i) => h.forEach(n => { people.push(n); house[n] = i; }));
    for (let t = 0; t < 5000; t++) {
      const r = people.slice();
      for (let i = r.length - 1; i > 0; i--) {
        const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
        [r[i], r[j]] = [r[j], r[i]];
      }
      if (people.every((p, i) => house[p] !== house[r[i]])) return people.map((p, i) => [p, r[i]]);
    }
    return null;
  }

  // ---------- vista del organizador ----------
  const DEFAULT = 'Kena, Tomás, Manuel\nMeme, Tata\nFranco, Ana, Rodrigo\nVero, Diego\nFeli, Vale';

  function showOrganizer() {
    app.innerHTML = `
      <div class="intro" style="padding-top:18px"><h1>Amigo Secreto Familia</h1>
      <p>Sorteo donde a nadie le toca alguien de su misma casa. Nadie, ni siquiera quien organiza, ve el resultado completo.</p></div>
      <div class="card">
        <label for="houses">Casas (una por línea, nombres separados por coma)</label>
        <textarea id="houses">${esc(DEFAULT)}</textarea>
        <div class="row">
          <div><label for="budget">Presupuesto (opcional)</label><input id="budget" placeholder="Ej: $20.000"></div>
          <div><label for="date">Fecha (opcional)</label><input id="date" placeholder="Ej: 24 de diciembre"></div>
        </div>
        <button class="primary" id="go">Sortear</button>
        <p id="msg" class="err"></p>
      </div>
      <div id="out"></div>`;
    document.getElementById('go').onclick = run;
    const saved = store.load();
    if (saved && saved.entries && saved.entries.length) renderResults(saved);
  }

  function run() {
    const houses = parseHouses(document.getElementById('houses').value);
    const msg = document.getElementById('msg');
    msg.textContent = '';
    const names = houses.flat();
    if (names.length < 3) { msg.textContent = 'Se necesitan al menos 3 personas.'; return; }
    if (new Set(names.map(n => n.toLowerCase())).size !== names.length) { msg.textContent = 'Hay nombres repetidos. Agrega una inicial para diferenciarlos.'; return; }
    const pairs = draw(houses);
    if (!pairs) { msg.textContent = 'No se puede sortear con estas casas (una casa tiene más de la mitad de las personas).'; return; }
    // Revisión automática del sorteo (sin mostrar quién le toca a quién)
    const houseOf = {}; houses.forEach((h, i) => h.forEach(n => houseOf[n] = i));
    const givers = new Set(pairs.map(x => x[0])), receivers = new Set(pairs.map(x => x[1]));
    const okAllGive = givers.size === names.length && names.every(n => givers.has(n));
    const okAllGet = receivers.size === names.length && names.every(n => receivers.has(n));
    const okHouse = pairs.every(([g, r]) => g !== r && houseOf[g] !== houseOf[r]);
    if (!(okAllGive && okAllGet && okHouse)) { msg.textContent = 'Algo salió mal en el sorteo. Recarga la página e inténtalo de nuevo.'; return; }
    const p = document.getElementById('budget').value.trim();
    const f = document.getElementById('date').value.trim();
    const base = location.href.split('#')[0];

    const entries = pairs.map(([g, r]) => ({ g, text: `Hola ${g}! Este es tu link del Amigo Secreto de la familia. Ábrelo para ver a quién te tocó (es solo para ti):\n${base}#${enc({ g, r, p, f })}` }));
    const saved = { entries, n: names.length, houses: document.getElementById('houses').value, sent: {} };
    store.save(saved);
    renderResults(saved);
  }

  // ---------- guardado en este navegador ----------
  const KEY = 'amigoSecretoFamilia_v1';
  const store = {
    load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
    save(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} },
    clear() { try { localStorage.removeItem(KEY); } catch (e) {} }
  };

  function renderResults(saved) {
    const n = saved.n;
    document.getElementById('houses').value = saved.houses;
    document.getElementById('houses').disabled = true;
    ['budget', 'date'].forEach(id => document.getElementById(id).disabled = true);
    const go = document.getElementById('go');
    go.disabled = true; go.textContent = 'Sorteo hecho'; go.style.opacity = .5;

    const out = document.getElementById('out');
    out.innerHTML = `
      <div class="card">
        <div class="warn"><b>Listo. No vuelvas a sortear.</b> Manda a cada persona su propio link y no abras los de otros, porque verías su resultado. El sorteo queda guardado en este navegador: si recargas la página, vuelve a aparecer igual.</div>
        <div class="ok">Sorteo revisado automáticamente:<br>✓ Las ${n} personas regalan una vez<br>✓ Las ${n} personas reciben exactamente un regalo (nadie queda sin regalo)<br>✓ A nadie le tocó alguien de su misma casa ni sí mismo</div>
        <div id="list" style="margin-top:10px"></div>
        <button class="btn ghost" id="copyall" style="width:100%;margin-top:12px">Copiar todos los links (para respaldo)</button>
        <p class="muted" style="font-size:14px;margin:8px 0 0">Pégalos en tus notas como respaldo. Los links no muestran a quién le toca a cada uno, solo para quién es.</p>
        <div style="margin-top:22px;border-top:1px solid var(--line);padding-top:14px">
          <button class="btn ghost" id="reset" style="width:100%">Hacer un sorteo nuevo</button>
          <div id="confirm" class="hidden warn" style="margin-top:10px">
            ¿Seguro? Se borra este sorteo y tendrías que mandar todos los links de nuevo. Los links que ya mandaste quedarían mezclados con el sorteo nuevo.
            <div class="row" style="margin-top:10px"><div><button class="btn primary" id="yes" style="margin:0">Sí, borrar</button></div><div><button class="btn ghost" id="no" style="width:100%">Cancelar</button></div></div>
          </div>
        </div>
      </div>`;

    const list = document.getElementById('list');
    saved.entries.forEach(({ g, text }) => {
      const row = document.createElement('div');
      row.className = 'person';
      row.innerHTML = `<span class="name">${esc(g)}</span>
        <span class="actions">
          <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(text)}">WhatsApp</a>
          <button class="btn ghost">Copiar</button>
        </span>`;
      const mark = () => {
        if (!row.querySelector('.sent')) row.querySelector('.name').insertAdjacentHTML('beforeend', ' <span class="sent">enviado</span>');
        saved.sent = saved.sent || {}; saved.sent[g] = true; store.save(saved);
      };
      if (saved.sent && saved.sent[g]) row.querySelector('.name').insertAdjacentHTML('beforeend', ' <span class="sent">enviado</span>');
      row.querySelector('.wa').addEventListener('click', mark);
      row.querySelector('.ghost').onclick = async (e) => {
        try { await navigator.clipboard.writeText(text); e.target.textContent = 'Copiado'; mark(); }
        catch (err) { e.target.textContent = 'No se pudo'; }
      };
      list.appendChild(row);
    });

    document.getElementById('copyall').onclick = async (e) => {
      const all = 'Amigo Secreto Familia - links (no abrir los de otros)\n\n' + saved.entries.map(x => x.text).join('\n\n');
      try { await navigator.clipboard.writeText(all); e.target.textContent = 'Copiados los ' + n + ' links'; }
      catch (err) { e.target.textContent = 'No se pudo copiar'; }
    };
    document.getElementById('reset').onclick = () => document.getElementById('confirm').classList.remove('hidden');
    document.getElementById('no').onclick = () => document.getElementById('confirm').classList.add('hidden');
    document.getElementById('yes').onclick = () => { store.clear(); showOrganizer(); };
  }

  function route() {
    const d = dec(location.hash.slice(1));
    if (d && d.g && d.r) showReveal(d); else showOrganizer();
  }
  window.addEventListener('hashchange', route);
  route();
})();

// ---------- nieve y estrellas ----------
(function () {
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const st = document.getElementById('stars');
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('span'); d.className = 'star';
    d.style.left = Math.random() * 100 + 'vw'; d.style.top = Math.random() * 55 + 'vh';
    d.style.animationDelay = (Math.random() * 3) + 's';
    const z = Math.random() < .2 ? 4 : (Math.random() < .5 ? 2 : 3); d.style.width = d.style.height = z + 'px';
    st.appendChild(d);
  }
  const c = document.getElementById('snow'), ctx = c.getContext('2d');
  let W, H, flakes = [];
  function size() { const r = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; c.width = W * r; c.height = H * r; ctx.setTransform(r, 0, 0, r, 0, 0); }
  size(); addEventListener('resize', size);
  const N = Math.min(160, Math.round(innerWidth / 6));
  for (let i = 0; i < N; i++) flakes.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2.6 + .8, s: Math.random() * .8 + .35, w: Math.random() * 6.28, o: Math.random() * .5 + .5 });
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const f of flakes) {
      ctx.globalAlpha = f.o; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fillStyle = '#fff'; ctx.fill();
      if (!reduce) { f.y += f.s * (f.r * .6); f.w += .015; f.x += Math.sin(f.w) * .45;
        if (f.y > H + 5) { f.y = -5; f.x = Math.random() * W; } }
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  draw();
})();
</script>
